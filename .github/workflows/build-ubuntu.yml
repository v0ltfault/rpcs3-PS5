name: Build (ubuntu-24.04 host)

# Builds dist/PPSA99300 with tools/bootstrap.sh on a GitHub-hosted Ubuntu runner, using
# Ubuntu's equivalents of the Arch packages the README lists. The result is a private
# workflow artifact for the repository owner's own console; it is never published
# (RPCS3 is GPL-2.0-only and the PS5 pieces are GPL-3.0: the combined binary cannot be
# redistributed, see README.md).
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          df -h /

      - uses: actions/checkout@v4
        with:
          submodules: false

      - name: Restore dependency cache
        uses: actions/cache/restore@v4
        with:
          path: |
            deps
            ~/.cache/ccache
          key: rpcs3-ps5-deps-${{ hashFiles('tools/fetch-deps.sh', 'tools/build-llvm.sh', 'tools/build-ffmpeg.sh', 'tools/build-driver-chain.sh', '.gitmodules') }}-${{ github.run_id }}
          restore-keys: |
            rpcs3-ps5-deps-${{ hashFiles('tools/fetch-deps.sh', 'tools/build-llvm.sh', 'tools/build-ffmpeg.sh', 'tools/build-driver-chain.sh', '.gitmodules') }}-

      - name: Host tools (Ubuntu equivalents of the Arch package list)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential clang lld llvm llvm-dev libclang-dev cmake ninja-build nasm make \
            python3 python3-pip python3-venv python3-ply python3-mako python3-yaml python3-markupsafe \
            git curl unzip tar pkg-config glslang-tools spirv-tools spirv-headers \
            llvm-spirv-18 libllvmspirvlib-18-dev libclc-18-dev bison flex autoconf automake libtool ccache
          sudo pip3 install --break-system-packages 'meson>=1.4,<1.9'
          # RPCS3 requires clang >= 19, but with -fno-exceptions clang 19 still fails -Werror=return-type on
          # functions that end in fmt::throw_exception (PPUDisAsm.h, SPUThread.h, atomic.cpp); the upstream
          # author builds with clang 21 on Arch. Add apt.llvm.org and install ONLY clang/lld/llvm 21.
          wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key | sudo gpg --dearmor -o /usr/share/keyrings/llvm.gpg
          echo 'deb [signed-by=/usr/share/keyrings/llvm.gpg] http://apt.llvm.org/noble/ llvm-toolchain-noble-21 main' | sudo tee /etc/apt/sources.list.d/llvm21.list
          sudo apt-get update && sudo apt-get install -y --no-install-recommends clang-21 lld-21 llvm-21 libclang-rt-21-dev
          # libclang-rt-21-dev: PS5_Vulkan's radv-link.sh links $(clang --print-resource-dir)/lib/linux/libclang_rt.builtins-x86_64.a
          # (Arch ships it inside compiler-rt; on Ubuntu it is a separate package).
          # llvm-21 provides /usr/lib/llvm-21/bin/llvm-config, which the SDK's shim uses (via LLVM_CONFIG below)
          # to find clang 21. Its /usr/bin/llvm-config-21 link is removed right after so Mesa's meson, which
          # ignores LLVM_CONFIG and takes the highest llvm-config-NN on PATH, keeps using 18.
          # The runner image preinstalls LLVM 16/17/18/19 tool sets; Mesa's meson takes the highest llvm-config it
          # finds and then wants LLVMSPIRVLib of that version, which noble only packages for 18. Leave only 18.
          sudo rm -f /usr/bin/llvm-config-21 /usr/bin/llvm-config-19 /usr/bin/llvm-config-17 /usr/bin/llvm-config-16
          sudo rm -rf /usr/lib/llvm-21/lib/cmake /usr/lib/llvm-19/lib/cmake /usr/lib/llvm-17/lib/cmake /usr/lib/llvm-16/lib/cmake
          sudo ln -sf /usr/bin/llvm-config-18 /usr/local/bin/llvm-config
          ls /usr/bin/llvm-config*
          for t in clang clang++ ld.lld lld; do sudo ln -sf /usr/bin/$t-21 /usr/local/bin/$t; done
          # The scripts call the unversioned names.
          sudo ln -sf /usr/bin/llvm-spirv-18 /usr/local/bin/llvm-spirv
          for t in clang clang++ llvm-spirv glslangValidator cmake ninja nasm python3 meson; do printf '  %-18s %s\n' "$t" "$(command -v $t || echo MISSING)"; done
          clang --version | head -1; ld.lld --version | head -1; meson --version

      - name: Drop cached items that bake in the host compiler or lack their git handle
        run: |
          rm -rf src/rpcs3
          # The SDK's bin/clang is linked to whatever clang the installer found at the time (18 on the
          # first run). Reinstall it every run so it resolves the compiler through LLVM_CONFIG below.
          rm -rf deps/sdk-rpcs3 deps/ps5-extra-libs

      # tools/bootstrap.sh, split in two so that only RPCS3 sees LLVM_CONFIG: Mesa's meson honours it too
      # and would then demand LLVMSPIRVLib 21 (run 10). Without it the SDK's clang shim resolves the
      # plain llvm-config (18) and builds the driver chain, PS5_LLVM and the libraries with clang 18,
      # exactly as the first runs did; the two compilers share the SDK's libc++ so the objects mix fine.
      - name: Deps, SDK, RADV driver, PS5 LLVM, zlib, iconv, ffmpeg (clang 18)
        env:
          CCACHE_DIR: /home/runner/.cache/ccache
          CCACHE_MAXSIZE: 3G
        run: |
          set -euo pipefail
          for t in git cmake ninja clang clang++ python3 curl nasm make llvm-spirv glslangValidator; do command -v $t >/dev/null || { echo "missing $t"; exit 2; }; done
          bash tools/fetch-deps.sh
          bash tools/install-sdk.sh
          deps/sdk-rpcs3/bin/clang --version | head -1
          bash tools/build-driver-chain.sh
          bash tools/build-llvm.sh
          bash tools/build-zlib.sh
          bash tools/build-libiconv.sh
          bash tools/build-ffmpeg.sh
          [[ -f deps/config_database.json ]] || bash tools/update-config-database.sh

      - name: RPCS3 (clang 21 through the SDK shim)
        env:
          LLVM_CONFIG: /usr/lib/llvm-21/bin/llvm-config
          CCACHE_DIR: /home/runner/.cache/ccache
          CCACHE_MAXSIZE: 3G
        run: |
          "$LLVM_CONFIG" --version; deps/sdk-rpcs3/bin/clang --version | head -1
          bash tools/build-rpcs3.sh
          ls -la dist/PPSA99300

      - name: Result
        if: always()
        run: |
          ls -la dist/PPSA99300 2>/dev/null || true
          find build -maxdepth 3 -name 'llvm-pie.elf' -o -maxdepth 3 -name '*.log' 2>/dev/null | head -20
          df -h /

      - name: Save dependency cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            deps
            ~/.cache/ccache
          key: rpcs3-ps5-deps-${{ hashFiles('tools/fetch-deps.sh', 'tools/build-llvm.sh', 'tools/build-ffmpeg.sh', 'tools/build-driver-chain.sh', '.gitmodules') }}-${{ github.run_id }}

      - uses: actions/upload-artifact@v4
        with:
          name: PPSA99300
          path: dist/PPSA99300
          retention-days: 14

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-logs
          path: |
            build/**/*.log
            build/**/llvm-pie.elf
          retention-days: 14
          if-no-files-found: ignore
